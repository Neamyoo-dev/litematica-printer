name: Release

# release: <default> (release title)
# dispatch (all): Manual release for $target_release_tag
# dispatch (specified): Manual release for $target_release_tag (subproject: $target_subproject)
run-name: |-
  ${{ github.event_name == 'workflow_dispatch' && format('Manual release for {0}{1}', inputs.target_release_tag, inputs.target_subproject && format(' (subproject: {0})', inputs.target_subproject) || '') || '' }}

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      target_subproject:
        description: Minecraft version to release
        type: choice
        options:
          - '26.2'
        required: false
        default: '26.2'
      target_release_tag:
        description: |-
          The tag of the release you want to append the artifact to.
          It must be an existing tag, otherwise publishing will fail.
          Match mod_version with a v prefix, for example v1.4.0-beta.1.
        type: string
        required: true

env:
  BUILD_TYPE: release

jobs:
  show_action_parameters:
    runs-on: ubuntu-latest
    steps:
      - name: Show action parameters
        run: |
          cat <<EOF > $GITHUB_STEP_SUMMARY
          ## Action Parameters
          - target_subproject: \`${{ github.event.inputs.target_subproject }}\`
          - target_release_tag: \`${{ github.event.inputs.target_release_tag }}\`
          EOF

  changelog:
    needs: validate_release
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.target_release_tag }}
          fetch-depth: 0

      - name: Generate publish related information
        id: release_info_for_changelog
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.target_release_tag }}
        run: |
          echo "tag_name=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff

      - name: Generate changelog
        run: git-cliff --latest -o CHANGELOG.md

      - name: Upload changelog to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info_for_changelog.outputs.tag_name }}
          body_path: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ensure the input release tag is valid
  validate_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.target_release_tag }}

      - name: Verify tag matches mod version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.target_release_tag }}
        run: |
          version="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')"
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "Release tag must be v$version; got $RELEASE_TAG"
            exit 1
          fi

      - name: Get github release information
        uses: cardinalby/git-get-release-action@1.2.5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag: ${{ github.event.release.tag_name || inputs.target_release_tag }}

  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit
    needs:
      - validate_release
    with:
      build_type: release
      build_ref: ${{ github.event.release.tag_name || inputs.target_release_tag }}
      download_dependencies: true
      publish: true
      target_subproject: ${{ inputs.target_subproject || '26.2' }}

  release:

    needs:
      - build
      - changelog
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.target_release_tag }}
          fetch-depth: 0
          fetch-tags: true

      - name: Display context
        run: |
          echo ref_name = ${{ github.ref_name }}
          echo target_subproject = ${{ github.event.inputs.target_subproject }}
          echo target_release_tag = ${{ github.event.inputs.target_release_tag }}

      - name: Download single-version artifact
        uses: actions/download-artifact@v8
        with:
          name: single-version
          path: single-version

      - name: Get github release information
        id: get_release
        uses: cardinalby/git-get-release-action@1.2.5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag: ${{ github.event.release.tag_name || inputs.target_release_tag }}

      - name: Generate publish related information
        id: release_info
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.target_release_tag }}
        run: |
          echo "tag_name=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          version="${RELEASE_TAG#v}"
          if [[ "${version%%+*}" == *-* ]]; then
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          files: |
            single-version/*.jar
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ steps.release_info.outputs.prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
